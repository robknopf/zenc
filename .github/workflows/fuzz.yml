name: Scheduled Fuzzing

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  fuzz:
    name: LibFuzzer
    runs-on: ubuntu-latest
    # fork: a hang (a run on 2026-11-25 kept the runner busy until it was lost) fails
    # the job instead
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libtcc-dev ccache

    - name: Prepare ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-fuzz-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-fuzz-
          ${{ runner.os }}-ccache-

    - name: Build Fuzzer
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        make fuzz-libfuzzer-build

    - name: Prepare Corpus
      run: make fuzz-corpus

    - name: Run Fuzzer
      run: |
        # fork: a crash or a hang fails the run (with `|| true` the job passed while
        # uploading crash files); the upload step below runs either way. Reaching the
        # memory limit is only a warning. (The harness's memory grew from input to input,
        # to 2 GB in about 7 minutes: the arena added a block after a reset whenever the
        # next one was too small. Fixed 2026-11-27; if the limit is reached again, look.)
        status=0
        ./zc-fuzz-libfuzzer fuzz/corpus -max_total_time=900 -timeout=30 -rss_limit_mb=2048 || status=$?
        if ls crash-* timeout-* >/dev/null 2>&1; then
          echo "::error::libFuzzer found a crash or a hang (see the fuzz-crashes artifact)"
          exit 1
        fi
        if [ "$status" -ne 0 ]; then
          echo "::warning::libFuzzer stopped with status $status (no crash or hang: likely the memory limit)"
        fi

    - name: Upload Crashes and Timeouts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: |
          crash-*
          timeout-*
        if-no-files-found: ignore
